<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>newapi渠道切换</title>
<style>
:root{color-scheme:dark;--bg:#141719;--panel:#202527;--border:#3a4245;--text:#f4f7f6;--muted:#aebbbb;--green:#6be4b3;--blue:#4ca0ff;--red:#ff9797}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"PingFang SC",sans-serif}button,input,select{font:inherit;color:inherit;background:#293033;border:1px solid #526065;border-radius:8px;min-height:44px;padding:8px 12px}button{cursor:pointer;transition:background .15s}button:hover{background:#3a474d}button:disabled{cursor:wait;opacity:.5}button.primary{background:#19654c;border-color:#288867}button.danger{color:var(--red)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}input[type=checkbox]{min-height:24px;width:22px;accent-color:var(--green)}header{padding:20px 28px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:16px}h1{font-size:24px;margin:0}header p{margin:4px 0 0;color:var(--muted)}main{max-width:1440px;padding:24px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:20px}.panel{border:1px solid var(--border);border-radius:14px;background:var(--panel);padding:20px;min-width:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}h2{margin:0;font-size:19px}.hint{color:var(--muted);margin:12px 0 18px;font-size:14px}.group{width:100%;display:block;text-align:left;margin-top:12px;padding:15px;overflow-wrap:anywhere}.group.selected{background:#233e34;border-color:var(--green)}.group strong{display:block}.group small{color:var(--muted)}.pill{display:inline-block;background:#303a3e;border-radius:20px;padding:4px 10px;font-size:12px}.good{color:var(--green)}.bad{color:var(--red)}.channel{display:grid;grid-template-columns:24px minmax(0,1fr) 90px 120px 60px;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid var(--border)}.channel .name{font-weight:600;overflow-wrap:anywhere}.channel small{display:block;color:var(--muted);overflow-wrap:anywhere}.priority{width:85px}.labels{color:var(--muted);font-size:13px}.result{font-size:13px}.result small{font-size:12px}.empty{color:var(--muted);padding:45px 12px;text-align:center}.full{width:100%}.section-title{margin-top:24px;margin-bottom:10px}#events{grid-column:1/-1}.event{display:grid;grid-template-columns:175px 120px minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}.event time{color:var(--muted)}dialog{color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:14px;max-width:520px;width:calc(100% - 32px);padding:24px}dialog::backdrop{background:#0009}label.field{display:block;margin:18px 0}label.field input,label.field select{display:block;width:100%;margin-top:7px}#notice{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);max-width:min(650px,calc(100% - 24px));background:#28473b;color:var(--text);border:1px solid var(--green);border-radius:10px;padding:14px 20px;z-index:5;display:none}.inline-id{max-width:180px}.disabled{opacity:.6}@media(max-width:1000px){main{grid-template-columns:240px minmax(0,1fr);padding:16px}.channel{grid-template-columns:24px minmax(0,1fr) 85px;gap:10px}.channel .result{grid-column:2}.channel button{grid-column:3;grid-row:auto}.channel.labels{display:none}}@media(max-width:700px){header{padding:16px;align-items:flex-start}h1{font-size:21px}main{grid-template-columns:1fr;gap:14px;padding:12px}.panel{padding:16px}.group{margin-top:8px}#events{grid-column:auto}.event{grid-template-columns:1fr;gap:2px}header p{font-size:13px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div><h1>newapi渠道切换</h1><p>分组单活 · 503 自动切换 · 高优先级恢复回切</p></div><span class="pill" id="health">连接中</span></header>
<main>
<aside class="panel"><div class="toolbar between"><h2>管理分组</h2><button class="primary" id="new-group">新建</button></div><p class="hint">每个分组独立配置渠道和优先级。</p><div id="groups"></div></aside>
<section class="panel" id="detail"><div class="empty">新建或选择一个分组开始配置</div></section>
<section class="panel" id="events"><div class="toolbar between"><h2>切换与测试记录</h2><button id="refresh">刷新</button></div><div id="event-list"></div></section>
</main>
<dialog id="create-dialog"><form id="create-form"><h2>新建管理分组</h2><label class="field">分组名称<input id="create-name" maxlength="128" required placeholder="例如：GPT 备用线路"></label><label class="field">对应 newapi 分组<select id="create-target" required></select></label><p class="hint">渠道启停会按此分组管理。使用多个 newapi 分组的渠道，请先在 newapi 中拆分后加入。</p><div class="toolbar"><button class="primary" type="submit">创建分组</button><button id="cancel-create" type="button">取消</button></div></form></dialog>
<div id="notice" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const base=new URL('./',location.href);
let state={groups:[],channels:[],tests:{},selected:null},dirty=false,noticeTimer,loading=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(text){clearTimeout(noticeTimer);$('#notice').textContent=text;$('#notice').style.display='block';noticeTimer=setTimeout(()=>$('#notice').style.display='none',7000)}
async function api(path,body,method){const r=await fetch(new URL('api/'+path,base),{method:method||(body?'POST':'GET'),headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(r.status===401)throw Error('登录已失效，请刷新页面重新登录');const j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');return j}
async function busy(button,fn){button.disabled=true;try{await fn()}catch(e){notice(e.message)}finally{button.disabled=false}}
const selected=()=>state.groups.find(g=>g.id===state.selected);
async function load(){if(loading)return;loading=true;try{const [groups,channels,events]=await Promise.all([api('groups'),api('channels'),api('events')]);state.groups=groups.groups;state.channels=channels.channels;state.tests=channels.tests;renderGroups();if(!dirty)renderDetail();renderEvents(events.events);$('#health').textContent='服务在线';$('#health').className='pill good'}catch(e){notice(e.message);$('#health').textContent='连接异常';$('#health').className='pill bad'}finally{loading=false}}
function renderGroups(){$('#groups').innerHTML=state.groups.length?state.groups.map(g=>`<button class="group ${state.selected===g.id?'selected':''}" data-select="${g.id}"><strong>${esc(g.name)}</strong><small>${g.channels.length} 个渠道 · ${g.enabled?'自动切换运行中':'已暂停'}<br>当前渠道：${g.current_channel_id?'#'+g.current_channel_id:'尚未选优'}</small></button>`).join(''):'<div class="empty">暂无分组</div>'}
function renderDetail(){const g=selected();if(!g){$('#detail').innerHTML='<div class="empty">新建或选择一个分组开始配置</div>';return}const chosen=new Map(g.channels.map(c=>[c.channel_id,c.priority]));const channels=state.channels.filter(c=>c.group===g.newapi_group).sort((a,b)=>(chosen.get(b.id)??-Infinity)-(chosen.get(a.id)??-Infinity)||a.id-b.id);const disabled=g.enabled?'disabled':'';
$('#detail').innerHTML=`<div class="toolbar between"><h2>${esc(g.name)}</h2><span class="pill ${g.enabled?'good':''}">${g.enabled?'自动切换运行中':'自动切换已暂停'}</span></div><p class="hint">newapi 分组：${esc(g.newapi_group)}<br>测试模型 gpt-6.1-sol。优先级越大越优先，同优先级按渠道 ID 从小到大。高优先级恢复后约 60 秒回切。</p><div class="toolbar"><button class="primary" data-action="activate">启用并选优</button><button data-action="pause" ${g.enabled?'':'disabled'}>暂停</button><button data-action="restore">恢复接管前状态</button><button data-action="rename">重命名</button><button class="danger" data-action="delete">删除</button></div><h3 class="section-title">渠道与优先级</h3><div class="toolbar"><input id="id-select" class="inline-id" placeholder="渠道 ID，如 48,54" aria-label="按渠道ID勾选" ${disabled}><button data-action="ids" ${disabled}>按 ID 勾选</button><button class="primary" data-action="save" ${disabled}>保存配置</button></div><p class="hint">先保存配置，再启用并选优。修改配置时请暂停；恢复接管前状态会撤销此分组的启停变更。</p><div class="channel labels"><span></span><span>渠道 / 地址 / 实际状态</span><span>优先级</span><span>最近测试</span><span>操作</span></div>${channels.length?channels.map(c=>{const t=state.tests[c.id];return `<div class="channel"><input aria-label="管理渠道${c.id}" type="checkbox" data-cid="${c.id}" ${chosen.has(c.id)?'checked':''} ${disabled}><div><div class="name">#${c.id} ${esc(c.name)}</div><small>${esc(c.base_url)}</small><span class="${c.status===1?'good':'bad'}">${c.status===1?'已启用':'已禁用'}</span>${c.id===g.current_channel_id?' · 当前选中':''}</div><input class="priority" type="number" step="1" data-priority="${c.id}" value="${chosen.get(c.id)??0}" aria-label="渠道${c.id}优先级" ${disabled}><div class="result ${t?(t.success?'good':'bad'):''}">${t?(t.success?'测试成功':'测试失败'):'未测试'}${t?`<small>${t.status_code??'网络错误'} · ${(t.elapsed_ms/1000).toFixed(2)}秒</small>`:''}</div><button data-test="${c.id}">测试</button></div>`}).join(''):'<div class="empty">该分组暂无单一分组渠道</div>'}`}
function renderEvents(events){const names={'503':'检测到503',test:'渠道测试',switched:'渠道切换',unavailable:'暂无可用候选',restored:'恢复状态',error:'巡检异常'};$('#event-list').innerHTML=events.length?events.map(e=>{const p=e.payload;return `<div class="event"><time>${new Date(e.created_at*1000).toLocaleString('zh-CN',{hour12:false})}</time><strong class="${p.success===false?'bad':p.type==='switched'?'good':''}">${esc(names[p.type]||p.type)}</strong><div>${esc(p.group_name||'')} ${p.type==='switched'?`#${p.previous_channel_id??p.failed_channel_id??'-'} → #${p.active_channel_id}`:p.candidate_channel_id?`#${p.candidate_channel_id} · HTTP ${p.status_code??'-'} · ${((p.elapsed_ms??0)/1000).toFixed(2)}秒`:esc(p.detail||'')} <small>${esc(p.reason||'')}</small></div></div>`}).join(''):'<div class="empty">暂无记录。启用分组后会记录测试和切换。</div>'}
$('#groups').addEventListener('click',e=>{const btn=e.target.closest('[data-select]');if(!btn)return;if(dirty&&!confirm('当前有未保存的配置，确定切换分组？'))return;dirty=false;state.selected=+btn.dataset.select;renderGroups();renderDetail()});
$('#detail').addEventListener('input',()=>dirty=true);
$('#detail').addEventListener('click',async e=>{const btn=e.target.closest('button');if(!btn)return;const g=selected();if(!g)return;await busy(btn,async()=>{if(btn.dataset.test){notice('正在测试 gpt-6.1-sol，请稍候…');const r=await api('test-channel',{channel_id:+btn.dataset.test});state.tests[r.channel_id]={...r,created_at:Date.now()/1000};notice(`#${r.channel_id} ${r.success?'测试成功':'测试失败'}，HTTP ${r.status_code??'网络错误'}，${(r.elapsed_ms/1000).toFixed(2)}秒`);if(!dirty)renderDetail();return}
const action=btn.dataset.action;
if(action==='ids'){const ids=$('#id-select').value.split(/[,，\s]+/).filter(Boolean).map(Number);const found=new Set([...document.querySelectorAll('[data-cid]')].map(c=>+c.dataset.cid));if(ids.some(id=>!found.has(id)))throw Error('包含不属于本分组的渠道 ID');for(const el of document.querySelectorAll('[data-cid]'))el.checked=ids.includes(+el.dataset.cid);dirty=true;return}
if(action==='save'){const rows=[...document.querySelectorAll('[data-cid]:checked')].map(el=>({channel_id:+el.dataset.cid,priority:Number(document.querySelector(`[data-priority="${el.dataset.cid}"]`).value)}));await api(`groups/${g.id}/channels`,{channels:rows});notice('配置已保存');dirty=false}
if(action==='activate'){if(dirty)throw Error('请先保存配置');notice('正在按优先级测试候选渠道…');const r=await api(`groups/${g.id}/activate`,{});notice(r.success?`已选中渠道 #${r.active_channel_id}`:'候选测试失败，保留当前渠道')}
if(action==='pause'){await api(`groups/${g.id}`,{enabled:false});notice('自动切换已暂停')}
if(action==='restore'){if(!confirm('恢复该分组接管前的渠道启停状态，并暂停自动切换？'))return;await api(`groups/${g.id}/restore`,{});dirty=false;notice('已恢复接管前状态')}
if(action==='rename'){const name=prompt('分组名称',g.name);if(name)await api(`groups/${g.id}`,{name})}
if(action==='delete'){if(g.enabled)throw Error('请先暂停或恢复');if(!confirm('删除分组配置？渠道启停状态将保留。'))return;await api(`groups/${g.id}`,undefined,'DELETE');dirty=false;state.selected=null}
await load()})});
$('#new-group').onclick=()=>{const groups=[...new Set(state.channels.map(c=>c.group).filter(s=>s&&!s.includes(',')))];$('#create-target').innerHTML=groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');$('#create-dialog').showModal();$('#create-name').focus()};
$('#cancel-create').onclick=()=>$('#create-dialog').close();
$('#create-form').onsubmit=async e=>{e.preventDefault();await busy(e.submitter,async()=>{const g=await api('groups',{name:$('#create-name').value,newapi_group:$('#create-target').value});$('#create-dialog').close();state.selected=g.id;dirty=false;await load()})};
$('#refresh').onclick=()=>load();load();setInterval(load,10000);
</script>
</body></html>
