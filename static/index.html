<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>newapi渠道切换</title><style>
:root{color-scheme:dark;--bg:#171717;--panel:#232323;--line:#3a3a3a;--muted:#a9a9a9;--accent:#23c58e;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1f1f1;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{height:66px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);gap:22px}h1{font-size:21px;margin:0}header span{color:var(--muted)}main{max-width:1320px;margin:25px auto;padding:0 20px;display:grid;grid-template-columns:340px 1fr;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}button,input,select{background:#303030;color:#eee;border:1px solid #555;border-radius:7px;padding:8px 10px}button{cursor:pointer}button.primary{background:#168966;border-color:#22bd8c}button.danger{color:#ff9b9b}.group{padding:13px;border:1px solid var(--line);border-radius:9px;margin:9px 0;cursor:pointer}.group.active{border-color:var(--accent);background:#20362f}.group b{display:block}.group small{color:var(--muted)}.row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:11px 0}.row:last-child{border:0}.row .grow{flex:1}.tag{font-size:12px;padding:3px 8px;border-radius:20px;background:#3b3b3b;color:#ccc}.on{color:var(--accent)}.off{color:#f27c7c}.hint{color:var(--muted);margin:5px 0 16px}.empty{padding:36px;text-align:center;color:var(--muted)}#toast{position:fixed;right:22px;bottom:22px;background:#195c49;padding:12px 16px;border-radius:8px;display:none}.priority{width:75px}.channel-list{max-height:550px;overflow:auto}
</style></head><body><header><h1>newapi渠道切换</h1><span>503 自动探测与单活切换</span><span id="health"></span></header><main><section class="panel"><div class="toolbar"><b>管理分组</b><button class="primary" id="addGroup">新建分组</button></div><div id="groups"></div></section><section class="panel"><div id="detail" class="empty">请选择左侧分组</div></section></main><div id="toast"></div><script>
const $=s=>document.querySelector(s);let state={groups:[],channels:[],selected:null};
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
async function load(){try{state=Object.assign(state,await api('/api/groups'));state.channels=(await api('/api/channels')).channels;renderGroups();if(state.selected)renderDetail()}catch(e){toast(e.message)}}
function renderGroups(){const el=$('#groups');el.innerHTML=state.groups.length?state.groups.map(g=>`<div class="group ${state.selected==g.id?'active':''}" onclick="selectGroup(${g.id})"><b>${esc(g.name)}</b><small>${g.channels.length} 个渠道 · 当前 #${g.current_channel_id||'未选择'}</small></div>`).join(''):'<div class="empty">还没有分组</div>'}
function selectGroup(id){state.selected=id;renderGroups();renderDetail()}
function renderDetail(){const g=state.groups.find(x=>x.id==state.selected);if(!g)return;const chosen=new Map(g.channels.map(x=>[x.channel_id,x.priority]));$('#detail').innerHTML=`<div class="toolbar"><input id="groupName" value="${esc(g.name)}"><button class="primary" onclick="saveName()">保存名称</button><button onclick="activateTop()">按最高优先级探测并启用</button><button class="danger" onclick="removeGroup()">删除分组</button></div><p class="hint">勾选要纳入本分组的渠道，优先级数字越大越优先；每个分组始终只启用一个渠道。捕获 503 后会从最高优先级开始用 gpt-6.1-sol 测试。</p><div class="toolbar"><button class="primary" onclick="saveChannels()">保存渠道配置</button><button onclick="testSelected()">测试勾选渠道</button></div><div class="channel-list">${state.channels.map(c=>{const checked=chosen.has(c.id);return `<div class="row"><input type="checkbox" data-cid="${c.id}" ${checked?'checked':''}><div class="grow"><b>#${c.id} ${esc(c.name||'')}</b><br><small>${esc(c.base_url||'')} · 原分组：${esc(c.group||'')} · <span class="${c.status==1?'on':'off'}">${c.status==1?'已启用':'已禁用'}</span></small></div><input class="priority" data-priority="${c.id}" type="number" value="${chosen.get(c.id)??0}" title="优先级"><button onclick="testOne(${c.id})">测试</button></div>`}).join('')}</div>`}
async function saveName(){const g=state.groups.find(x=>x.id==state.selected);await api('/api/groups/'+g.id,{method:'POST',body:JSON.stringify({name:$('#groupName').value})});toast('已保存');load()}
async function saveChannels(){const g=state.groups.find(x=>x.id==state.selected);const rows=[...document.querySelectorAll('[data-cid]:checked')].map(x=>({channel_id:+x.dataset.cid,priority:+document.querySelector(`[data-priority="${x.dataset.cid}"]`).value||0}));await api(`/api/groups/${g.id}/channels`,{method:'POST',body:JSON.stringify({channels:rows})});toast('渠道配置已保存');load()}
async function testOne(id){const r=await api('/api/test-channel',{method:'POST',body:JSON.stringify({channel_id:id})});toast(`#${id} ${r.success?'测试成功':'测试失败'} · ${r.status_code||'-'} · ${r.elapsed_ms}ms`)}
async function testSelected(){const ids=[...document.querySelectorAll('[data-cid]:checked')].map(x=>+x.dataset.cid);for(const id of ids)await testOne(id)}
async function activateTop(){const g=state.groups.find(x=>x.id==state.selected);if(!g.channels.length)return toast('请先保存渠道');const id=[...g.channels].sort((a,b)=>b.priority-a.priority)[0].channel_id;const r=await api(`/api/groups/${g.id}/activate`,{method:'POST',body:JSON.stringify({channel_id:id})});toast(r.events[0].success?'已测试并启用':'测试失败，未切换');load()}
async function removeGroup(){const g=state.groups.find(x=>x.id==state.selected);if(!confirm('删除这个分组？'))return;await api('/api/groups/'+g.id,{method:'DELETE'});state.selected=null;load()}
$('#addGroup').onclick=async()=>{const name=prompt('分组名称');if(!name)return;const g=await api('/api/groups',{method:'POST',body:JSON.stringify({name})});state.selected=g.id;load()};function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();setInterval(load,15000);api('/api/health').then(()=>$('#health').textContent='● 在线').catch(()=>$('#health').textContent='● 离线');
</script></body></html>
